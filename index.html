<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ごはんOS</title>
  <link rel="stylesheet" href="css/style.css?v=20261006-2">
</head>
<body>
  <header class="app-header">
    <div><p class="eyebrow">GOHAN OS</p><h1>ごはんOS</h1></div>
    <div class="header-actions"><button id="ingredientsButton" class="secondary-button">食材</button><button id="shoppingButton" class="secondary-button">買い物</button><button id="newRecipeButton" class="primary-button">＋ レシピ登録</button></div>
  </header>
  <main class="container">
    <section id="listView" class="view"><div class="toolbar"><input id="searchInput" type="search" placeholder="レシピ名・材料名で検索"><select id="categoryFilter"><option value="">主カテゴリすべて</option></select><select id="genreFilter"><option value="">ジャンルすべて</option></select><select id="tagFilter"><option value="">タグすべて</option></select><label class="check-filter"><input id="favoriteFilter" type="checkbox"> お気に入り</label></div><div id="recipeList" class="recipe-list"></div></section>
    <section id="formView" class="view hidden"><div class="section-heading"><button id="backFromForm" class="text-button">← レシピ一覧</button><h2 id="formTitle">レシピ登録</h2></div><form id="recipeForm" class="recipe-form"><div class="form-grid"><label>レシピ名<input name="name" required maxlength="100"></label><label>主カテゴリ<select name="cooking_category" id="formCategory" required></select></label><label>ジャンル<select name="genre" id="formGenre" required></select></label><label class="full">説明<textarea name="description" rows="2"></textarea></label></div><section class="form-section"><div class="section-title-row"><h3>材料</h3><button type="button" id="addIngredient" class="secondary-button">＋ 材料を追加</button></div><div id="ingredientRows" class="ingredient-rows"></div></section><section class="form-section"><div class="section-title-row"><h3>作り方</h3><button type="button" id="addInstruction" class="secondary-button">＋ 手順を追加</button></div><div id="instructionRows" class="instruction-rows"></div></section><section class="form-section"><h3>タグ</h3><div id="tagChoices" class="tag-choices"></div></section><section class="form-section"><div class="toggle-row"><label><input name="is_favorite" type="checkbox"> お気に入り</label><label><input name="make_again" type="checkbox"> また作りたい</label></div><label>メモ<textarea name="memo" rows="4"></textarea></label></section><div class="form-actions"><button type="button" id="cancelForm" class="secondary-button">キャンセル</button><button type="submit" class="primary-button">保存</button></div></form></section>
    <section id="detailView" class="view hidden"><div class="section-heading"><button id="backFromDetail" class="text-button">← レシピ一覧</button><div class="detail-actions"><button id="editRecipe" class="secondary-button">編集</button><button id="deleteRecipe" class="danger-button">削除</button></div></div><article id="recipeDetail" class="recipe-detail"></article></section>
    <section id="shoppingView" class="view hidden"><div class="section-heading"><button id="backFromShopping" class="text-button">← レシピ一覧</button><div class="shopping-heading-actions"><h2>買い物</h2><button id="shoppingHistoryButton" class="secondary-button" type="button">買い物履歴</button></div></div><div id="shoppingMainContent"><section class="shopping-section"><div class="shopping-section-heading"><div><h3>よく買うもの</h3><p class="meta">必要なものにチェックして、買い物リストへ追加します。</p></div><div class="header-actions"><button id="deleteSelectedShopping" class="danger-button" type="button" disabled>選択したものを削除</button><button id="addSelectedShopping" class="primary-button">選択したものをリストに追加</button></div></div><div id="shoppingMaster" class="shopping-master"></div><form id="shoppingMasterForm" class="shopping-master-form"><input id="shoppingMasterInputName" type="text" maxlength="100" placeholder="よく買うものを追加（例：豆腐）" required><select id="shoppingMasterInputCategory"></select><button type="submit" class="secondary-button">＋ よく買うものを追加</button></form></section><section class="shopping-section"><div class="shopping-section-heading"><div><h3>その他の買い物を追加</h3><p class="meta">登録されていないものも自由に追加できます。</p></div></div><form id="shoppingFreeForm" class="shopping-free-form"><input id="shoppingInputName" type="text" maxlength="100" placeholder="例：牛乳、子供のお菓子、ラップ" required><select id="shoppingInputCategory"></select><button type="submit" class="secondary-button">追加</button></form></section><section class="shopping-section"><div class="shopping-section-heading"><div><h3>今日の買い物</h3><p id="shoppingListSummary" class="meta"></p></div><label class="check-filter"><input id="showPurchased" type="checkbox"> 購入済みを表示</label></div><div id="shoppingList" class="shopping-list"></div></section></div><section id="shoppingHistorySection" class="shopping-section hidden"><div class="shopping-section-heading"><div><h3>買い物履歴</h3><p class="meta">実際に購入済みにした記録です。買い物リストから削除しても残ります。</p></div><button id="backToShoppingButton" class="secondary-button" type="button">← 買い物に戻る</button></div><div id="shoppingHistory" class="shopping-history"></div></section></section>
    <section id="ingredientsView" class="view hidden"><div class="section-heading"><button id="backFromIngredients" class="text-button">← レシピ一覧</button><h2>食材</h2></div><section class="ingredient-section"><div class="ingredient-section-heading"><div><h3>食材を登録</h3><p class="meta">登録した食材は「ある／ない」を別々に管理します。</p></div></div><form id="ingredientForm" class="ingredient-form"><input id="ingredientInputName" type="text" maxlength="100" placeholder="食材名（例：豆腐）" required><select id="ingredientInputCategory"></select><button type="submit" class="primary-button">＋ 食材を登録</button></form></section><section class="ingredient-section"><div class="ingredient-section-heading"><div><h3>食材一覧</h3><p id="ingredientSummary" class="meta"></p></div><label class="check-filter"><input id="ingredientAvailableOnly" type="checkbox"> あるものだけ</label></div><div class="ingredient-toolbar"><input id="ingredientSearch" type="search" placeholder="食材名で検索"><select id="ingredientCategoryFilter"></select></div><div id="ingredientList" class="ingredient-list"></div></section></section>
  </main><div id="loading" class="loading hidden">読み込み中…</div><div id="toast" class="toast hidden"></div>
  <script type="module" src="js/app.js?v=20261007-2"></script>
  <script type="module">
    import { supabase } from './js/supabase.js?v=20261007-1';
    const deleteButton=document.getElementById('deleteSelectedShopping'),master=document.getElementById('shoppingMaster'),historyButton=document.getElementById('shoppingHistoryButton'),backToShoppingButton=document.getElementById('backToShoppingButton'),shoppingMainContent=document.getElementById('shoppingMainContent'),historySection=document.getElementById('shoppingHistorySection'),historyContainer=document.getElementById('shoppingHistory');
    function updateDeleteButton(){deleteButton.disabled=!master.querySelector('.shopping-master-check:checked')}
    master.addEventListener('change',updateDeleteButton);
    deleteButton.addEventListener('click',async()=>{const ids=[...master.querySelectorAll('.shopping-master-check:checked')].map(x=>x.dataset.id);if(!ids.length||!confirm(`${ids.length}件を「よく買うもの」から削除しますか？`))return;deleteButton.disabled=true;const{error}=await supabase.from('shopping_master').delete().in('id',ids);if(error){alert(`削除できませんでした: ${error.message}`);updateDeleteButton();return}document.getElementById('shoppingButton').click()});
    function formatHistoryDate(v){return new Date(v).toLocaleDateString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',weekday:'short'})}
    function formatHistoryMonth(v){const d=new Date(v);return `${d.getFullYear()}年${d.getMonth()+1}月`}
    async function loadPurchaseHistory(){historyContainer.innerHTML='<div class="empty">読み込み中…</div>';const{data,error}=await supabase.from('shopping_purchase_history').select('*').order('purchased_at',{ascending:false});if(error){historyContainer.innerHTML=`<div class="empty">履歴を読み込めませんでした。<br>${String(error.message).replace(/[&<>"']/g,'')}</div>`;return}renderPurchaseHistory(data||[])}
    function renderPurchaseHistory(history){if(!history.length){historyContainer.innerHTML='<div class="empty">まだ購入履歴がありません。</div>';return}const months=[],mm=new Map();history.forEach(item=>{const d=new Date(item.purchased_at),mk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,dk=`${mk}-${String(d.getDate()).padStart(2,'0')}`;let m=mm.get(mk);if(!m){m={label:formatHistoryMonth(item.purchased_at),dates:[],dateMap:new Map()};mm.set(mk,m);months.push(m)}let day=m.dateMap.get(dk);if(!day){day={label:formatHistoryDate(item.purchased_at),items:[]};m.dateMap.set(dk,day);m.dates.push(day)}day.items.push(item)});historyContainer.innerHTML=months.map(m=>`<section class="shopping-history-month"><h4>${m.label}</h4>${m.dates.map(d=>`<div class="shopping-history-day"><h5>${d.label}</h5><div class="shopping-history-items">${d.items.map(item=>`<div class="shopping-history-item"><div><span class="shopping-history-name">${String(item.name).replace(/[&<>"']/g,'')}</span><span class="shopping-history-category">${String(item.category).replace(/[&<>"']/g,'')}</span></div><button type="button" class="remove-button history-delete" data-id="${item.id}">削除</button></div>`).join('')}</div></div>`).join('')}</section>`).join('');historyContainer.querySelectorAll('.history-delete').forEach(b=>b.onclick=async()=>{if(!confirm('この購入履歴を削除しますか？\n買い物リストの状態は変更しません。'))return;const{error}=await supabase.from('shopping_purchase_history').delete().eq('id',b.dataset.id);if(error){alert(`削除できませんでした: ${error.message}`);return}await loadPurchaseHistory()})}
    historyButton.addEventListener('click',async()=>{shoppingMainContent.classList.add('hidden');historySection.classList.remove('hidden');await loadPurchaseHistory()});
    backToShoppingButton.addEventListener('click',()=>{historySection.classList.add('hidden');shoppingMainContent.classList.remove('hidden')});
  </script>
  <script type="module" src="js/ingredients.js?v=20261007-1"></script>
  <script type="module" src="js/shopping-price.js?v=20261007-1"></script>
</body></html>
